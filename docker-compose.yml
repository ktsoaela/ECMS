services:
  mysql:
    image: mysql:8.4
    container_name: email_campaigns_mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    container_name: email_campaigns_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      APP_URL: http://localhost:${BACKEND_PORT:-8000}
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    build: ./backend
    container_name: email_campaigns_queue
    env_file:
      - ./backend/.env
    environment:
      APP_URL: http://localhost:${BACKEND_PORT:-8000}
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/var/www/html
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90"]
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: email_campaigns_frontend
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    environment:
      NG_CLI_ANALYTICS: "false"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
  frontend_node_modules:
