<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 mb-1">Log in</h1>
          <p class="text-secondary mb-4">Use your account to open campaigns.</p>

          @if (formError()) {
            <div class="alert alert-danger" role="alert">{{ formError() }}</div>
          }

          <form class="vstack gap-3" [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div>
              <label class="form-label" for="login-email">Email</label>
              <input id="login-email" type="email" class="form-control" formControlName="email" autocomplete="username" />
            </div>
            <div>
              <label class="form-label" for="login-password">Password</label>
              <input id="login-password" type="password" class="form-control" formControlName="password" autocomplete="current-password" />
            </div>
            <button class="btn btn-primary" type="submit" [disabled]="loading()">
              {{ loading() ? 'Logging in…' : 'Log in' }}
            </button>
          </form>

          <p class="mb-0 mt-3">
            No account yet?
            <a routerLink="/register">Register</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
